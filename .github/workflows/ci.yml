name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs-portfolio/package-lock.json

      - name: Install dependencies
        working-directory: ./nextjs-portfolio
        run: npm ci

      - name: Lint
        working-directory: ./nextjs-portfolio
        run: npm run lint

      - name: Build
        working-directory: ./nextjs-portfolio
        run: npm run build
